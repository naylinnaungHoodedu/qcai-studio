# API image, built by Cloud Build from a clean checkout of one commit (never on a workstation).
# Run: gcloud builds submit --config infra/cloudbuild/api-image.yaml --substitutions _GIT_SHA=<40-char commit> .
# The image is tagged with that commit, never :latest, and stamped with it (/health reports it). Cloud Build
# records the pushed digest; deploy that digest with scripts/deploy_by_digest.py (infra/cloudrun/deployment.md).
steps:
  - id: require-commit
    name: bash
    args:
      - -c
      - '[[ "${_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "_GIT_SHA must be a full 40-character commit"; exit 1; }'
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/qcai-repo/qcai-api:${_GIT_SHA}
      - --build-arg
      - GIT_SHA=${_GIT_SHA}
      - .

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/qcai-repo/qcai-api:${_GIT_SHA}

options:
  substitutionOption: MUST_MATCH
