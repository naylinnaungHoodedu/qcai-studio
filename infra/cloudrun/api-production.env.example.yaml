ENVIRONMENT: "production"
API_BASE_URL: "https://api.qantumlearn.academy"
SITE_URL: "https://qantumlearn.academy"
SOURCE_ASSETS_ROOT: "/app/source-assets"
CORPUS_MANIFEST_PATH: "/app/corpus/public/manifest.json"
ENFORCE_CORPUS_GOVERNANCE: "true"
GROUNDING_POLICY_VERSION: "cs595-v1"
ALLOWED_ORIGINS: '["https://qantumlearn.academy"]'
ENABLE_DEMO_AUTH: "false"
CLOUD_SQL_CONNECTION_NAME: "naylinnaung:us-central1:qcai-db"
CLOUD_SQL_IP_TYPE: "PUBLIC"
# Phase 2 (spans, manifest v2, retrieval gates). These are the defaults outside development; each change
# that alters what learners see is a D-05 remediation release and logs a config.override event.
RETRIEVAL_GATE: "p1-floor"
SEMANTIC_RETRIEVAL_ENABLED: "false"
SPAN_RESOLVER_ROUTE_ENABLED: "false"
CITATION_PROVISIONAL_LIFT_ENABLED: "false"
# Spec conflict 29: with p1-floor, start-up refuses a manifest that approves a document. Only an owner decision sets
# this to "true" (it logs a config.override event).
ALLOW_P1_FLOOR_WITH_DOCUMENTS: "false"
MANIFEST_DRIFT_CHECK: "fast"
# Phase 3 (two-channel tutor; docs/architecture/phase3-implementation-spec.md section 6). Defaults outside development.
# Plan Phase 3 G: two_pass_tutor MUST run shadow-only until the Phase 4 exit; zero outputs reach learners. "on" is refused by
# settings before then; "shadow" outside development is a D-05 decision (DI-32) and logs a config.override event.
TWO_PASS_TUTOR: "off"
# How long a shadow run may hold its worker after the response is sent: the shipped configuration package's
# tutor_pipeline.budgets.shadow_ms (v2 with the Phase 3 release, v3 from the Phase 4 release; 2000 ms; PD-11; v4 from the Phase 5 release keeps it).
# Set TWO_PASS_SHADOW_BUDGET_MS only to override it.
# The response ledger records every tutor delivery (not learner-visible; R-22). Disabling it logs a config.override event.
TUTOR_LEDGER_ENABLED: "true"
# The learner waits at most the legacy ledger append budget plus the package's 250 ms grace (the budget also sets each
# attempt's PostgreSQL lock, statement and idle-in-transaction timeouts); it then fails open. The budget is the shipped
# configuration package's tutor_pipeline.budgets.ledger_append_ms (v2 with the Phase 3 release, v3 from the Phase 4
# release; 1500 ms; PD-11). Set TUTOR_LEDGER_APPEND_BUDGET_MS only to override it. The ledger also records each
# /qa/ask answer.
# New routes and the evidence panel stay off under the freeze; enabling either logs a config.override event.
LEDGER_ROUTE_ENABLED: "false"
EVIDENCE_PANEL_ENABLED: "false"
# With the panel off nothing shows a V1.7 conflict, so the legacy guard withholds a contained answer whose quotations
# conflict (AC-4-6; spec 4.15); with it on, the package's conflict policy (v1.v1_7.on_conflict) decides: disclose
# labels the conflict, withhold withholds the answer. Under D-31 production quotes nothing.
LEDGER_RATE_LIMIT: "30/minute"
# Phase 4 (V1 validation; docs/architecture/phase4-implementation-spec.md section 6). V1 runs inside the two-pass shadow
# only: "shadow" records V1's verdict beside the Phase 3 decision. "off" is refused outside development (plan 13.6: no
# flag may disable V1), and "enforce" is refused until configuration package flag_policy.phase4_exit_passed is true.
V1_PIPELINE: "shadow"
# Phase 5 (model gateway and V2; docs/architecture/phase5-implementation-spec.md section 6). Defaults outside development.
# MODEL_GATEWAY stays off: the V2 panel runs only in the two-pass shadow, and "on" is refused before the Phase 5 exit
# (configuration package flag_policy.phase5_exit_passed); "shadow" outside development logs a config.override event.
MODEL_GATEWAY: "off"
# D-23: the providers this environment opts in to model egress; empty, and no provider is registered (D-12 open).
MODEL_EGRESS_PROVIDERS: "[]"
# The VERTEX_AI_* and OPENAI_CHAT_MODEL variables are retired. If one is set, start-up logs its name; the value of any
# retired key is still redacted in every log line (DI-81 removes them).
# Secrets such as DATABASE_URL, OPENAI_API_KEY, PINECONE_API_KEY, PINECONE_INDEX,
# AUTH0_DOMAIN, and AUTH0_AUDIENCE should be injected from Secret Manager rather than
# checked into the repository.
