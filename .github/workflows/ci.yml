name: cs595-quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt pip-audit
      - run: python -m pytest -q -m "not release_artifacts" apps/api/tests evaluation/tests
      # --check-recall-stop: plan Phase 2 L, spec conflict 29 (no approved document under the p1-floor gate).
      - run: python scripts/validate_corpus.py --check-public-assets --check-recall-stop
      - run: python scripts/validate_lqs.py --allow-draft
      # Phase 2 (corpus, span identity, retrieval integrity). The checkout has no LFS content, so video hashes are
      # checked through their LFS pointer oids, which are the content sha256 (AC-2-6).
      - run: python scripts/config_package.py --check
      # Phase 3: configuration package v1 stays readable for one release (DI-42).
      - run: python scripts/config_package.py --check --path apps/api/app/config_package/v1.json
      # Phase 4: configuration package v2 stays readable for one release (DI-63).
      - run: python scripts/config_package.py --check --path apps/api/app/config_package/v2.json
      # Phase 5: configuration package v3 stays readable for one release (DI-84).
      - run: python scripts/config_package.py --check --path apps/api/app/config_package/v3.json
      # Phase 6: configuration package v4 stays readable for one release (DI-100).
      - run: python scripts/config_package.py --check --path apps/api/app/config_package/v4.json
      # Phase 7: configuration package v5 stays readable for one release (DI-112).
      - run: python scripts/config_package.py --check --path apps/api/app/config_package/v5.json
      # Plan Phase 7 D task 6, K AC-7-6 and 12.5: the golden-set gate. Exit 6 when the package, the misconception library,
      # the routing table or the golden set differs from the committed golden run (a change without a run), or when the
      # package's version is missing from docs/evaluation/phase7/package_versions.json or recorded there with another
      # sha256 (a package edit that keeps its package_version), or when that history does not start with the base
      # branch's committed history unchanged (append-only: a rewritten or removed entry); exit 1 on drift. The base
      # branch is fetched by name (the pull request's base, else main) and read with git show, not by ancestry.
      - env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python scripts/run_golden_set.py --check docs/evaluation/phase7/golden_run_v1.json --base-ref FETCH_HEAD
      # Plan Phase 7 P (R-18) and Phase 11 task 3: the source-fidelity check over the 12 DOCX. --check proves the committed report
      # (3 mismatches) is current; --require-zero (AC-11-3) joins CI once the Content Owner corrects the DOCX at source (DI-105).
      - run: python scripts/check_source_fidelity.py --check docs/evaluation/phase7/source_fidelity_report_v1.json
      # Plan Phase 6 F/K: the residual report (synthetic telemetry, not research results): the seeded draw over 6070 synthetic
      # deliveries, the Wilson bound of 0 errors in 300 audited items below 1.3% (AC-6-5), the gold chain and an unchanged ledger.
      - run: python scripts/run_v3_residual_report.py --check docs/evaluation/phase6/v3_residual_report_v1.json
      # Plan Phase 5 P/J: F-1 (ledger verdicts for 100% of fixture responses) and fault injection, one to three
      # providers down, on development fakes (fixture measurements, not E2 results). Exit 3 is an F-1 or matrix stop;
      # exit 5 a V2 call after a V1 fail or a delivery without a passing vote.
      - run: python scripts/run_v2_fixtures.py --check docs/evaluation/phase5/v2_fixture_report_v1.json
      # E12: the shipped non-development learner answer bodies equal Phase 4's (sha256 only; no corpus text committed).
      - run: python scripts/capture_public_payloads.py --check apps/api/tests/data/phase4_public_payloads_v1.json
      # Plan Phase 4 F/H/K: the hashed adversarial fixture set and its report (fixture measurements, not research
      # results). Exit 3 is a plan L stop (answer-rate floor, V1 composition, or V1 p95 budget); exit 5 an adversarial
      # case delivered.
      - run: python scripts/run_v1_fixtures.py --check docs/evaluation/phase4/v1_fixture_report_v1.json
      - run: python scripts/authorization_matrix.py --check
      # Plan Phase 3 F: the three-plan replay over public-corpus fixtures (not E3 or LQ-1 evidence); exit 3 is the
      # plan L bound-claim-ratio stop.
      - run: python scripts/replay_tutor_plans.py --check docs/evaluation/phase3/three_plan_replay_v1.json
      - run: python scripts/generate_manifest.py --check
      - run: python scripts/validate_corpus.py --check-hashes --check-near-duplicates
      - run: python scripts/calibrate_abstention.py --check docs/evaluation/phase2/calibration_record_v1.json
      # AC-2-7 path scans of the tree and of each image's build context (a proxy for the image). No licensed-passage
      # fingerprints reach CI (D-14) and no image or release is built here, so the report's ac_2_7 block says
      # "partial": this run does not evidence AC-2-7 in full. The exit-gate run adds --image-tar, --release-zip,
      # --fingerprints and --require-ac-2-7 (infra/cloudrun/deployment.md).
      - run: python scripts/scan_boundary.py --repo --docker-context apps/api/Dockerfile:. --docker-context apps/frontend/Dockerfile:apps/frontend --report boundary-scan.json
      - if: always()
        run: cat boundary-scan.json || true
      - run: pip-audit -r apps/api/requirements.txt

  # Task 2.8 / AC-2-7, path half over a BUILT image (not only its build context): build the API image exactly as
  # Cloud Build does (apps/api/Dockerfile, repository root as context), then scan every layer of `docker save`.
  # Nothing is pushed or deployed. The passage half still needs the private-plane fingerprints (D-14).
  api-image-boundary-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt
      - run: docker build -f apps/api/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t qcai-api-scan:ci .
      - run: docker save qcai-api-scan:ci -o api-image.tar
      - run: python scripts/scan_boundary.py --image-tar api-image.tar --report image-boundary-scan.json
      - if: always()
        run: cat image-boundary-scan.json || true

  # Task 1.10 (R-52): the API suite and the schema checks against PostgreSQL 16, the Cloud SQL major version.
  # The service container is disposable; conftest uses TEST_DATABASE_URL and never an ambient DATABASE_URL.
  # Both drivers (DI-46): psycopg, and pg8000, the driver production uses through the Cloud SQL connector. The pg8000
  # leg's URL goes through pg8000's legacy pg8000.connect; production's connector calls pg8000.dbapi.connect, whose
  # error classes differ, and test_m1_* runs that interface on both legs (spec 7.19).
  # The legs report as "api-postgres (psycopg)" and "api-postgres (pg8000)"; the job named api-postgres below is the
  # required status check on main (P1-D-12) and passes only when both legs pass.
  api-postgres-driver:
    name: api-postgres (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [psycopg, pg8000]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qcai_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+${{ matrix.driver }}://postgres@localhost:5432/qcai_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt
      - run: psql -h localhost -U postgres -d qcai_test -c "SELECT version();" -c "SHOW TimeZone;"
      - run: python -m pytest -q -rxX -m "not release_artifacts" apps/api/tests

  # The required check "api-postgres" (P1-D-12): a matrix renames its checks, so this job carries the required name
  # and fails unless every driver leg of api-postgres-driver succeeded.
  api-postgres:
    if: always()
    needs: [api-postgres-driver]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.api-postgres-driver.result }}" = "success"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run lint
        working-directory: apps/frontend
      - run: npm run typecheck
        working-directory: apps/frontend
      - run: npm run test:integration
        working-directory: apps/frontend
      # What ships must carry no high or critical advisory, as pip-audit holds the API; dev tooling is not shipped.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/frontend

  # Release bundles exist only when a version is cut; packaging refuses unapproved public assets.
  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt
      # The packager excludes private-plane, licensed and secret-like paths and scans its own bundles; this step
      # records the release scan as CI evidence (task 2.8: "licensed-passage scans of images and releases").
      - run: python tools/package_release.py
      - run: python scripts/scan_boundary.py --release-zip dist/release/qcai-studio-v1.0.0-part1-app-docs-media.zip --release-zip dist/release/qcai-studio-v1.0.0-part2-hydrated-media.zip --report release-boundary-scan.json
      - if: always()
        run: cat release-boundary-scan.json || true
      - run: python -m pytest -q -m release_artifacts apps/api/tests/test_deployment_artifacts.py
