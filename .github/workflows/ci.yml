name: cs595-quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt pip-audit
      - run: python -m pytest -q -m "not release_artifacts" apps/api/tests evaluation/tests
      - run: python scripts/validate_corpus.py --check-public-assets
      - run: python scripts/validate_lqs.py --allow-draft
      - run: pip-audit -r apps/api/requirements.txt

  # Task 1.10 (R-52): the API suite and the schema checks against PostgreSQL 16, the Cloud SQL major version.
  # The service container is disposable; conftest uses TEST_DATABASE_URL and never an ambient DATABASE_URL.
  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qcai_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/qcai_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt
      - run: psql -h localhost -U postgres -d qcai_test -c "SELECT version();" -c "SHOW TimeZone;"
      - run: python -m pytest -q -rxX -m "not release_artifacts" apps/api/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run lint
        working-directory: apps/frontend
      - run: npm run test:integration
        working-directory: apps/frontend

  # Release bundles exist only when a version is cut; packaging refuses unapproved public assets.
  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python tools/package_release.py
      - run: python -m pytest -q -m release_artifacts apps/api/tests/test_deployment_artifacts.py
