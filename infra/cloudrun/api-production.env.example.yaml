ENVIRONMENT: "production"
API_BASE_URL: "https://api.qantumlearn.academy"
SITE_URL: "https://qantumlearn.academy"
SOURCE_ASSETS_ROOT: "/app/source-assets"
CORPUS_MANIFEST_PATH: "/app/corpus/public/manifest.json"
ENFORCE_CORPUS_GOVERNANCE: "true"
GROUNDING_POLICY_VERSION: "cs595-v1"
ALLOWED_ORIGINS: '["https://qantumlearn.academy"]'
ENABLE_DEMO_AUTH: "false"
CLOUD_SQL_CONNECTION_NAME: "naylinnaung:us-central1:qcai-db"
CLOUD_SQL_IP_TYPE: "PUBLIC"
# Phase 2 (spans, manifest v2, retrieval gates). These are the defaults outside development; each change
# that alters what learners see is a D-05 remediation release and logs a config.override event.
RETRIEVAL_GATE: "p1-floor"
SEMANTIC_RETRIEVAL_ENABLED: "false"
SPAN_RESOLVER_ROUTE_ENABLED: "false"
CITATION_PROVISIONAL_LIFT_ENABLED: "false"
# Spec conflict 29: with p1-floor, start-up refuses a manifest that approves a document. Only an owner decision sets
# this to "true" (it logs a config.override event).
ALLOW_P1_FLOOR_WITH_DOCUMENTS: "false"
MANIFEST_DRIFT_CHECK: "fast"
# Phase 3 (two-channel tutor; docs/architecture/phase3-implementation-spec.md section 6). Defaults outside development.
# Plan Phase 3 G: two_pass_tutor MUST run shadow-only until the Phase 4 exit; zero outputs reach learners. "on" is refused by
# settings before then; "shadow" outside development is a D-05 decision (DI-32) and logs a config.override event.
TWO_PASS_TUTOR: "off"
# How long a shadow run may hold its worker after the response is sent.
TWO_PASS_SHADOW_BUDGET_MS: "2000"
# The response ledger records every tutor delivery (not learner-visible; R-22). Disabling it logs a config.override event.
TUTOR_LEDGER_ENABLED: "true"
# The synchronous legacy ledger append fails open after this budget (also its PostgreSQL lock_timeout).
TUTOR_LEDGER_APPEND_BUDGET_MS: "1500"
# New routes and the evidence panel stay off under the freeze; enabling either logs a config.override event.
LEDGER_ROUTE_ENABLED: "false"
EVIDENCE_PANEL_ENABLED: "false"
TUTOR_TURNS_RATE_LIMIT: "8/minute"
LEDGER_RATE_LIMIT: "30/minute"
# Secrets such as DATABASE_URL, OPENAI_API_KEY, PINECONE_API_KEY, PINECONE_INDEX,
# AUTH0_DOMAIN, and AUTH0_AUDIENCE should be injected from Secret Manager rather than
# checked into the repository.
